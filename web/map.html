<!DOCTYPE html>
<html>
  <head>
    <title>Map with APIss</title>
    <style>
      #map {
        height: 400px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h3>Our Location</h3>
    
    <div id="map"></div>

    <script>
      let map;
      function initMap() {
        const myLocation = { lat: 40.7128, lng: -74.0060 };
        
        map = new google.maps.Map(document.getElementById("map"), {
          center: myLocation,
          zoom: 14,
        });

        new google.maps.Marker({
          position: myLocation,
          map: map,
          title: "We are here!",
        });
      }
    </script>

    <script src="https://googleapis.com" async defer></script>
  </body>
</html>
